<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" width="100%" style="display:block">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d2b"/>
      <stop offset="50%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nameGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="200" fill="url(#bg)"/>

  <!-- Twinkling white stars -->
  <circle cx="45" cy="18" r="1.2" fill="white" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="120" cy="42" r="0.9" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="12" r="1.4" fill="white" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="310" cy="55" r="1.0" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="385" cy="22" r="1.3" fill="white" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="480" cy="48" r="0.8" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.0s" repeatCount="indefinite"/></circle>
  <circle cx="570" cy="16" r="1.1" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="660" cy="38" r="1.2" fill="white" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="740" cy="10" r="0.9" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="830" cy="52" r="1.3" fill="white" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="920" cy="25" r="1.0" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="1010" cy="44" r="1.2" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="1090" cy="15" r="0.8" fill="white" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.0s" repeatCount="indefinite"/></circle>
  <circle cx="1160" cy="38" r="1.1" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="70" cy="70" r="0.9" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="88" r="1.1" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="78" r="0.8" fill="white" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="1050" cy="72" r="1.0" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.0s" repeatCount="indefinite"/></circle>
  <circle cx="1140" cy="85" r="0.9" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="30" cy="150" r="1.0" fill="white" opacity="0.4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="100" cy="170" r="1.2" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="155" r="0.8" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="950" cy="160" r="1.1" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="175" r="0.9" fill="white" opacity="0.4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="1170" cy="155" r="1.0" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.7s" repeatCount="indefinite"/></circle>

  <!-- Pink/purple glowing accent stars -->
  <circle cx="80" cy="32" r="1.8" fill="#f472b6" filter="url(#glow)" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="60" r="1.5" fill="#c084fc" filter="url(#glow)" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="30" r="1.6" fill="#e879f9" filter="url(#glow)" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="55" r="1.4" fill="#f472b6" filter="url(#glow)" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="880" cy="20" r="1.7" fill="#c084fc" filter="url(#glow)" opacity="0.7"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.0s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="60" r="1.5" fill="#e879f9" filter="url(#glow)" opacity="0.9"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="165" r="1.4" fill="#c084fc" filter="url(#glow)" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="1020" cy="170" r="1.6" fill="#f472b6" filter="url(#glow)" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/></circle>

  <!-- Shooting star 1 -->
  <g opacity="0">
    <line x1="0" y1="0" x2="-60" y2="0" stroke="url(#nameGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="0" cy="0" r="2" fill="white"/>
    <animateTransform attributeName="transform" type="translate" values="-60,30; 1300,110" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="2.8s" begin="0s" repeatCount="indefinite"/>
  </g>

  <!-- Shooting star 2 -->
  <g opacity="0">
    <line x1="0" y1="0" x2="-50" y2="0" stroke="url(#nameGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="white"/>
    <animateTransform attributeName="transform" type="translate" values="-60,80; 1300,170" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- Shooting star 3 -->
  <g opacity="0">
    <line x1="0" y1="0" x2="-70" y2="0" stroke="url(#nameGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <circle cx="0" cy="0" r="2.2" fill="white"/>
    <animateTransform attributeName="transform" type="translate" values="-60,10; 1300,60" dur="2.5s" begin="2.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="2.5s" begin="2.1s" repeatCount="indefinite"/>
  </g>

  <!-- Text on top of everything -->
  <text x="600" y="94" text-anchor="middle"
        font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="54" font-weight="bold"
        fill="url(#nameGrad)" filter="url(#nameGlow)">Joy Stephan</text>

  <text x="600" y="135" text-anchor="middle"
        font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="18" fill="#c084fc" letter-spacing="1">
    Software Engineer · AI · Open to Opportunities
  </text>
</svg>
