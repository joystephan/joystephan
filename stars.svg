  <text x="148" y="387" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#e2e8f0">Exploring <tspan font-weight="bold" fill="#f472b6">AI integration</tspan>, advanced frontend engineering &amp; scalable architecture</text>

  <!-- 🤝 shake -->
  <text x="110" y="439" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="21">🤝<animateTransform attributeName="transform" type="translate" values="0,0;3,0;0,0;-3,0;0,0" dur="1.8s" repeatCount="indefinite"/></text>
  <text x="148" y="439" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#e2e8f0">Open to <tspan font-weight="bold" fill="#f472b6">collaborations, internships</tspan> &amp; impactful tech opportunities</text>

