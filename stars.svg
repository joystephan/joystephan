<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" width="100%" style="display:block">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d2b"/>
      <stop offset="50%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nameGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full background -->
  <rect x="0" y="0" width="1200" height="480" fill="url(#bg)"/>

  <!-- ── Twinkling stars spread across full canvas ── -->
  <circle cx="45" cy="18" r="1.2" fill="white" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="120" cy="42" r="0.9" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="12" r="1.4" fill="white" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="310" cy="55" r="1.0" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="385" cy="22" r="1.3" fill="white" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="480" cy="48" r="0.8" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.0s" repeatCount="indefinite"/></circle>
  <circle cx="570" cy="16" r="1.1" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="660" cy="38" r="1.2" fill="white" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="740" cy="10" r="0.9" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="830" cy="52" r="1.3" fill="white" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="920" cy="25" r="1.0" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="1010" cy="44" r="1.2" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="1090" cy="15" r="0.8" fill="white" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.0s" repeatCount="indefinite"/></circle>
  <circle cx="1160" cy="38" r="1.1" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.6s" repeatCount="indefinite"/></circle>
  <!-- Mid-canvas stars -->
  <circle cx="70" cy="140" r="0.9" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="180" r="1.1" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="120" r="0.8" fill="white" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="1050" cy="160" r="1.0" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.0s" repeatCount="indefinite"/></circle>
  <circle cx="1140" cy="200" r="0.9" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="55" cy="250" r="1.2" fill="white" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="1170" cy="270" r="1.0" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="35" cy="320" r="0.8" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="1155" cy="340" r="1.1" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
  <!-- Lower stars -->
  <circle cx="30" cy="400" r="1.0" fill="white" opacity="0.4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="100" cy="440" r="1.2" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="420" r="0.8" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="950" cy="410" r="1.1" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="450" r="0.9" fill="white" opacity="0.4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="1170" cy="430" r="1.0" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="380" r="0.9" fill="white" opacity="0.4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="460" r="1.0" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.0s" repeatCount="indefinite"/></circle>

  <!-- Pink/purple glowing accent stars -->
  <circle cx="80" cy="32" r="1.8" fill="#f472b6" filter="url(#glow)" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="60" r="1.5" fill="#c084fc" filter="url(#glow)" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="30" r="1.6" fill="#e879f9" filter="url(#glow)" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="880" cy="20" r="1.7" fill="#c084fc" filter="url(#glow)" opacity="0.7"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.0s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="60" r="1.5" fill="#e879f9" filter="url(#glow)" opacity="0.9"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="220" r="1.6" fill="#f472b6" filter="url(#glow)" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="1140" cy="300" r="1.4" fill="#c084fc" filter="url(#glow)" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="420" r="1.4" fill="#c084fc" filter="url(#glow)" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="1020" cy="440" r="1.6" fill="#f472b6" filter="url(#glow)" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="400" r="1.5" fill="#e879f9" filter="url(#glow)" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.0s" repeatCount="indefinite"/></circle>

  <!-- ── Shooting stars (diagonal, crossing full canvas) ── -->
  <g opacity="0">
    <line x1="0" y1="0" x2="-78" y2="-14" stroke="url(#nameGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.2" fill="white" filter="url(#glow)"/>
    <animateTransform attributeName="transform" type="translate" values="-100,40; 1350,280" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="3.2s" begin="0s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="0" y1="0" x2="-65" y2="-12" stroke="url(#nameGrad)" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.6" fill="white" filter="url(#glow)"/>
    <animateTransform attributeName="transform" type="translate" values="-100,150; 1350,380" dur="3.8s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="3.8s" begin="1.3s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="0" y1="0" x2="-85" y2="-15" stroke="url(#nameGrad)" stroke-width="2.0" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="white" filter="url(#glow)"/>
    <animateTransform attributeName="transform" type="translate" values="200,-20; 1400,180" dur="2.6s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="2.6s" begin="2.2s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="0" y1="0" x2="-60" y2="-11" stroke="url(#nameGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.4" fill="white" filter="url(#glow)"/>
    <animateTransform attributeName="transform" type="translate" values="-100,320; 1350,460" dur="4.0s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="4.0s" begin="0.7s" repeatCount="indefinite"/>
  </g>

  <!-- ── Name + subtitle ── -->
  <text x="600" y="78" text-anchor="middle"
        font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="52" font-weight="bold"
        fill="url(#nameGrad)" filter="url(#nameGlow)">Joy Stephan</text>

  <text x="600" y="113" text-anchor="middle"
        font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="17" fill="#c084fc" letter-spacing="1.5">
    Software Engineer · AI · Open to Opportunities
  </text>

  <!-- Separator -->
  <line x1="380" y1="138" x2="820" y2="138" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1"/>

  <!-- ── Bio lines ── -->
    <!-- 👋 wave -->
  <text x="110" y="182" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="21">👋<animateTransform attributeName="transform" type="rotate" values="0 119 176;22 119 176;0 119 176;-8 119 176;0 119 176" dur="2.4s" repeatCount="indefinite"/></text>
  <text x="148" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#e2e8f0">Hey! I'm <tspan font-weight="bold" fill="#f472b6">Joy Stephan</tspan> — I turn ideas into sleek digital products</text>

  <!-- 💻 pulse -->
  <text x="110" y="236" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="21">💻<animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/></text>
  <text x="148" y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#e2e8f0">Crafting modern <tspan font-weight="bold" fill="#f472b6">web, mobile &amp; AI-powered</tspan> experiences that actually look good</text>

  <!-- ⚡ double flash -->
  <text x="110" y="290" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="21">⚡<animate attributeName="opacity" values="1;0.2;1;0.2;1" dur="1.6s" repeatCount="indefinite"/></text>
  <text x="148" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#e2e8f0">Stack: <tspan font-weight="bold" fill="#f472b6">Python . React Native · Expo · TypeScript</tspan> — fast, scalable &amp; pixel-perfect</text>

  <!-- 🤖 rock -->
  <text x="110" y="344" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="21">🤖<animateTransform attributeName="transform" type="rotate" values="0 121 338;15 121 338;0 121 338;-15 121 338;0 121 338" dur="3.0s" repeatCount="indefinite"/></text>
  <text x="148" y="344" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#e2e8f0">Deep-diving into <tspan font-weight="bold" fill="#f472b6">AI Engineering</tspan> — RAG, Agents, LLMs &amp; beyond</text>

  <!-- 🚀 launch -->
  <text x="110" y="398" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="21">🚀<animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="1.6s" repeatCount="indefinite"/></text>
  <text x="148" y="398" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#e2e8f0">Always building, always learning — open to collabs &amp; opportunities that excite me!</text>
</svg>
