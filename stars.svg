<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" width="1200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d2b"/>
      <stop offset="50%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>

  <!-- Twinkling stars -->
  <circle cx="30" cy="15" r="1" fill="white"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="90" cy="8" r="1.5" fill="white"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite" begin="0.3s"/></circle>
  <circle cx="160" cy="25" r="1" fill="white"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite" begin="0.7s"/></circle>
  <circle cx="240" cy="12" r="1.5" fill="white"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite" begin="0.5s"/></circle>
  <circle cx="320" cy="30" r="1" fill="white"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite" begin="1s"/></circle>
  <circle cx="420" cy="10" r="1.5" fill="white"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.2s"/></circle>
  <circle cx="500" cy="22" r="1" fill="white"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.9s" repeatCount="indefinite" begin="0.8s"/></circle>
  <circle cx="580" cy="8" r="1" fill="white"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite" begin="0.4s"/></circle>
  <circle cx="680" cy="18" r="1.5" fill="white"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.1s" repeatCount="indefinite" begin="0.9s"/></circle>
  <circle cx="760" cy="5" r="1" fill="white"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.7s" repeatCount="indefinite" begin="0.6s"/></circle>
  <circle cx="850" cy="28" r="1.5" fill="white"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.6s" repeatCount="indefinite" begin="1.1s"/></circle>
  <circle cx="940" cy="12" r="1" fill="white"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="0.3s"/></circle>
  <circle cx="1030" cy="22" r="1.5" fill="white"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite" begin="0.7s"/></circle>
  <circle cx="1120" cy="10" r="1" fill="white"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite" begin="0.5s"/></circle>
  <circle cx="1180" cy="30" r="1" fill="white"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" repeatCount="indefinite" begin="1.2s"/></circle>
  <circle cx="60" cy="75" r="1" fill="white"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.3s" repeatCount="indefinite" begin="0.4s"/></circle>
  <circle cx="180" cy="65" r="1.5" fill="white"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" begin="1s"/></circle>
  <circle cx="380" cy="80" r="1" fill="white"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.6s" repeatCount="indefinite" begin="0.2s"/></circle>
  <circle cx="650" cy="70" r="1" fill="white"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite" begin="0.8s"/></circle>
  <circle cx="870" cy="75" r="1.5" fill="white"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.7s" repeatCount="indefinite" begin="0.6s"/></circle>
  <circle cx="1080" cy="65" r="1" fill="white"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" begin="1.1s"/></circle>
  <circle cx="40" cy="160" r="1" fill="white"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.2s" repeatCount="indefinite" begin="0.5s"/></circle>
  <circle cx="200" cy="150" r="1.5" fill="white"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.9s" repeatCount="indefinite" begin="0.9s"/></circle>
  <circle cx="450" cy="165" r="1" fill="white"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite" begin="0.3s"/></circle>
  <circle cx="750" cy="155" r="1" fill="white"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.1s" repeatCount="indefinite" begin="1.2s"/></circle>
  <circle cx="1000" cy="160" r="1.5" fill="white"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" repeatCount="indefinite" begin="0.7s"/></circle>
  <circle cx="1160" cy="148" r="1" fill="white"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.3s" repeatCount="indefinite" begin="0.4s"/></circle>

  <!-- Pink/purple glowing stars -->
  <circle cx="150" cy="45" r="2" fill="#f472b6" filter="url(#glow)"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="950" cy="35" r="2" fill="#c084fc" filter="url(#glow)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" begin="1s"/></circle>
  <circle cx="1100" cy="140" r="1.5" fill="#f472b6" filter="url(#glow)"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.8s" repeatCount="indefinite" begin="0.5s"/></circle>
  <circle cx="300" cy="130" r="1.5" fill="#c084fc" filter="url(#glow)"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite" begin="1.3s"/></circle>

  <!-- Shooting star 1 -->
  <line x1="0" y1="0" x2="80" y2="25" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.15;0.8;1" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="translate" from="-80 0" to="1300 100" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </line>

  <!-- Shooting star 2 -->
  <line x1="0" y1="0" x2="60" y2="20" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8;0.8;0" keyTimes="0;0.05;0.15;0.7;1" dur="5s" repeatCount="indefinite" begin="2s"/>
    <animateTransform attributeName="transform" type="translate" from="200 -20" to="1400 130" dur="5s" repeatCount="indefinite" begin="2s"/>
  </line>

  <!-- Shooting star 3 -->
  <line x1="0" y1="0" x2="70" y2="22" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.05;0.15;0.75;1" dur="3.5s" repeatCount="indefinite" begin="3.5s"/>
    <animateTransform attributeName="transform" type="translate" from="-50 50" to="1300 160" dur="3.5s" repeatCount="indefinite" begin="3.5s"/>
  </line>

  <!-- Name & subtitle -->
  <text x="600" y="92" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="54" font-weight="bold" fill="#f472b6" filter="url(#glow)">Joy Stephan</text>
  <text x="600" y="130" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="18" fill="#c084fc">Software Engineer | AI | Open to Opportunities</text>
</svg>
