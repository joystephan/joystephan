  <text x="148" y="309" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#e2e8f0">Building fast, scalable &amp; visually polished digital products</text>
  <text x="148" y="335" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#c4b5d8">with <tspan font-weight="bold" fill="#f472b6">React Native · Expo · TypeScript</tspan> &amp; modern frontend technologies</text>

