  <text x="148" y="257" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#e2e8f0">Software Engineer focused on crafting modern <tspan font-weight="bold" fill="#f472b6">web, mobile &amp; AI-powered</tspan> experiences</text>

